name: CI

on:
  push:
    branches: [main]
    # A `v*` tag cuts a release. Every gate below runs on it first — the release job needs them —
    # so a tag is never the first time the code is checked.
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  analyze:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The pure-Dart packages hold the load-bearing logic — certificate pinning, the mesh
      # protocol, queue semantics, the scrobble latch — and run on the VM with no emulator.
      - name: Package tests
        run: |
          for pkg in packages/*/; do
            [ -d "$pkg/test" ] || continue
            echo "::group::$pkg"
            # A package that reaches Flutter — chordia_player does, through just_audio — has to run
            # under `flutter test`. `dart test` compiles it for the plain VM, where `dart:ui` does
            # not exist, and the failure names flutter_test's own files rather than the package.
            if grep -q '^  flutter:' "$pkg/pubspec.yaml"; then
              (cd "$pkg" && flutter test)
            else
              (cd "$pkg" && dart test)
            fi
            echo "::endgroup::"
          done
      - name: App tests
        run: flutter test
        working-directory: app

  drift-check:
    # Generated code and synced locale assets are committed, so a change that was never regenerated
    # is a diff here rather than a surprise at runtime.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Check out the shared locale catalogs beside this repo
        uses: actions/checkout@v7
        with:
          repository: chordia-fm/i18n
          path: .i18n-src
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Locale assets are in sync
        run: dart tool/sync_i18n.dart --check --source .i18n-src
      - name: Generated API models match the vendored schema
        run: dart tool/gen_api.dart --check
      # build_runner has to run in the package that owns the builder; from the workspace root it
      # finds no code and cheerfully writes nothing.
      - name: Drift output matches the schema
        run: dart run build_runner build
        working-directory: packages/chordia_db
      - name: Nothing regenerated differently
        run: git diff --exit-code

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle resolves the Android plugin, the Kotlin plugin and every plugin AAR on a cold
      # runner, which is nearly all of this job's four minutes -- `flutter-action`'s own cache
      # covers the Flutter SDK and the pub cache, and nothing under `~/.gradle`.
      #
      # Explicit rather than setup-java's `cache: gradle`, which caches these same two paths but
      # deliberately sets NO restore-keys (actions/setup-java#269): touching any `*.gradle*` file
      # misses outright and re-resolves the entire dependency set from scratch. Here that falls
      # back to the previous entry and Gradle fetches only what actually changed. Same two paths
      # setup-java used, so this replaces that cache rather than layering a second one over it.
      #
      # A stale entry cannot fake a green build. `caches/modules-2` is content-addressed by
      # group:artifact:version plus checksum and `wrapper/dists` by the exact `distributionUrl`,
      # so Gradle reuses only a file it asked for by name and downloads anything else; nothing
      # here is a build output, since `org.gradle.caching` is not enabled in gradle.properties.
      # No gate reads Gradle state in any case -- analyze, test and drift-check never invoke it,
      # and this job's only assertion is that the APK builds from the checked-out source.
      - name: Cache the Gradle dependency cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # `pubspec.lock` is in the key because the resolved plugin set decides which AARs
          # Gradle pulls, and `FLUTTER_VERSION` because the embedding and the engine artifacts
          # are versioned with the SDK. Only the trailing hash relaxes on fallback.
          key: gradle-dev-${{ runner.os }}-${{ runner.arch }}-jdk17-flutter${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle.properties', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-dev-${{ runner.os }}-${{ runner.arch }}-jdk17-flutter${{ env.FLUTTER_VERSION }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          # `cache: true` already covers the SDK and `~/.pub-cache`, keyed on pubspec.lock. What
          # it does not distinguish is that `flutter build apk` precaches the Android engine
          # artifacts into the SDK directory: analyze/test/drift-check finish first and save an
          # SDK without them under the shared default key, so this job re-downloads them every
          # run and can never save them back (the key it would write already exists). Its own key
          # keeps them. The placeholders still pin os, channel, exact version, arch and the
          # release hash, so an entry can only ever be that same SDK.
          cache-key: "flutter-android-:os:-:channel:-:version:-:arch:-:hash:"
      - run: flutter pub get
      - name: Build dev APK
        run: >-
          flutter build apk --debug --flavor dev
          -t lib/main_dev.dart
          --dart-define-from-file=../env/dev.json
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: chordia-dev-apk
          path: app/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error

  release:
    # Tag-triggered only, and only after the gates above have gone green on that exact commit — a
    # release is the one build nobody gets to re-run after the fact.
    #
    # Runs on Blacksmith like everything else. There is deliberately no macOS job: iOS is not a
    # target yet, and a GitHub-hosted macOS runner is the one thing this org has no minutes for.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, test, drift-check]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      # For `gh release create`. Everything else in this workflow is read-only.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `--generate-notes` writes the changelog from the commits since the previous tag, and it
          # can only see the ones that were fetched.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle resolves the Android plugin, the Kotlin plugin and every plugin AAR on a cold
      # runner, which is nearly all of this job's four minutes -- `flutter-action`'s own cache
      # covers the Flutter SDK and the pub cache, and nothing under `~/.gradle`.
      #
      # Explicit rather than setup-java's `cache: gradle`, which caches these same two paths but
      # deliberately sets NO restore-keys (actions/setup-java#269): touching any `*.gradle*` file
      # misses outright and re-resolves the entire dependency set from scratch. Here that falls
      # back to the previous entry and Gradle fetches only what actually changed. Same two paths
      # setup-java used, so this replaces that cache rather than layering a second one over it.
      #
      # A stale entry cannot fake a green build. `caches/modules-2` is content-addressed by
      # group:artifact:version plus checksum and `wrapper/dists` by the exact `distributionUrl`,
      # so Gradle reuses only a file it asked for by name and downloads anything else; nothing
      # here is a build output, since `org.gradle.caching` is not enabled in gradle.properties.
      # No gate reads Gradle state in any case -- analyze, test and drift-check never invoke it,
      # and this job's only assertion is that the APK builds from the checked-out source.
      - name: Cache the Gradle dependency cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # `pubspec.lock` is in the key because the resolved plugin set decides which AARs
          # Gradle pulls, and `FLUTTER_VERSION` because the embedding and the engine artifacts
          # are versioned with the SDK. Only the trailing hash relaxes on fallback.
          key: gradle-prod-${{ runner.os }}-${{ runner.arch }}-jdk17-flutter${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle.properties', 'app/android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          # First fallback relaxes only the trailing hash. The second relaxes the dev/prod
          # partition as well: releases are rare enough that their own entry is usually evicted,
          # and the dev entry the push/PR runs keep warm is the same content-addressed module
          # cache, just missing the release-only pieces (R8 and friends) that Gradle then
          # downloads. Everything identifying the toolchain -- os, arch, JDK, Flutter version --
          # stays pinned in both.
          restore-keys: |
            gradle-prod-${{ runner.os }}-${{ runner.arch }}-jdk17-flutter${{ env.FLUTTER_VERSION }}-
            gradle-dev-${{ runner.os }}-${{ runner.arch }}-jdk17-flutter${{ env.FLUTTER_VERSION }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Version from the tag
        id: version
        run: |
          set -euo pipefail
          # `v0.2.0` -> `0.2.0`. This has to match what the Hub's release feed reports and what
          # `package_info_plus` reads back on the device, or the in-app update check compares two
          # different numbers and either never prompts or prompts forever.
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/android/chordia-release.jks
          # A secret that is missing or did not decode must stop the run here. The Gradle config
          # falls back to the debug key when key.properties is absent, which is right for a
          # contributor and catastrophic for a release: Android refuses to install an APK whose
          # signer changed, so every existing user's update would break silently.
          test -s app/android/chordia-release.jks
          {
            echo "storeFile=chordia-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      # Two builds, because they are two different artifacts. The universal APK installs on
      # anything and is what the in-app update prompt offers; the per-ABI builds are roughly half
      # the size for anyone who knows which one they want.
      - name: Build the universal APK
        working-directory: app
        run: >-
          flutter build apk --release --flavor prod
          -t lib/main_prod.dart
          --dart-define-from-file=../env/prod.json
          --build-name=${{ steps.version.outputs.number }}
          --build-number=${{ github.run_number }}
      - name: Collect it
        run: |
          set -euo pipefail
          v='${{ steps.version.outputs.number }}'
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-prod-release.apk "release/chordia-$v-universal.apk"
          # The deobfuscation map for the build people actually install. Named for that build
          # rather than for the release, because the split APKs below overwrite this file with
          # a map that does not describe it.
          cp app/build/app/outputs/mapping/prodRelease/mapping.txt "release/chordia-$v-universal-mapping.txt"

      - name: Build the per-ABI APKs
        working-directory: app
        # Exactly the two architectures phones ship: the default target list also builds x86_64,
        # which is emulators only and already covered by the universal APK.
        run: >-
          flutter build apk --release --flavor prod --split-per-abi
          --target-platform android-arm,android-arm64
          -t lib/main_prod.dart
          --dart-define-from-file=../env/prod.json
          --build-name=${{ steps.version.outputs.number }}
          --build-number=${{ github.run_number }}
      - name: Collect them, and checksum the lot
        run: |
          set -euo pipefail
          v='${{ steps.version.outputs.number }}'
          out=app/build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-prod-release.apk" "release/chordia-$v-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-prod-release.apk" "release/chordia-$v-armeabi-v7a.apk"
          # Relative names, so `sha256sum -c SHA256SUMS` works in whatever directory somebody
          # downloaded the files into.
          cd release && sha256sum chordia-*.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag with a suffix (`v0.3.0-rc.1`) is a pre-release, and marking it keeps it out of
          # `/releases/latest` — which is the endpoint the Hub reads, so an unmarked release
          # candidate would be offered to every phone as an update.
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          # Re-runnable: a job that failed after creating the release uploads into the existing one
          # rather than dying on "release already exists".
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            || gh release upload "$GITHUB_REF_NAME" release/* --clobber

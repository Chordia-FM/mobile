name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  analyze:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The pure-Dart packages hold the load-bearing logic — certificate pinning, the mesh
      # protocol, queue semantics, the scrobble latch — and run on the VM with no emulator.
      - name: Package tests
        run: |
          for pkg in packages/*/; do
            if [ -d "$pkg/test" ]; then
              echo "::group::$pkg"
              (cd "$pkg" && dart test)
              echo "::endgroup::"
            fi
          done
      - name: App tests
        run: flutter test
        working-directory: app

  drift-check:
    # Generated code and synced locale assets are committed, so a change that was never regenerated
    # is a diff here rather than a surprise at runtime.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Check out the shared locale catalogs beside this repo
        uses: actions/checkout@v4
        with:
          repository: chordia-fm/i18n
          path: .i18n-src
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Locale assets are in sync
        run: dart tool/sync_i18n.dart --check --source .i18n-src
      - name: Generated API models match the vendored schema
        run: dart tool/gen_api.dart --check
      # build_runner has to run in the package that owns the builder; from the workspace root it
      # finds no code and cheerfully writes nothing.
      - name: Drift output matches the schema
        run: dart run build_runner build
        working-directory: packages/chordia_db
      - name: Nothing regenerated differently
        run: git diff --exit-code

  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build dev APK
        run: >-
          flutter build apk --debug --flavor dev
          -t lib/main_dev.dart
          --dart-define-from-file=../env/dev.json
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: chordia-dev-apk
          path: app/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error

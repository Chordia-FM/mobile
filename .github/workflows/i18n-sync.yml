# Resync the locale assets from the shared catalogs, and open the PR itself.
#
# ## Why this exists
#
# `app/assets/i18n/en.json` and `app/lib/i18n/keys.g.dart` are generated from the `i18n` repo and
# committed here. The moment a change lands there, these go stale — and nothing in either repo
# notices. The i18n pull request has no idea this repo exists, and `drift-check` only runs when
# somebody pushes here.
#
# On 2026-09-01 that gap was a whole morning: settings copy merged upstream, `drift-check` went red
# on main, and it was found only because an unrelated pull request happened to run CI.
#
# So this repo watches instead of waiting to be told. It needs no cross-repo credential — `i18n` is
# public, and opening a pull request here uses this repository's own token.
#
# ## Why it opens a pull request rather than just failing
#
# A red scheduled job is a notification, and notifications get missed — this org has had CI red for
# fifteen consecutive runs without anyone noticing. A pull request is the work already done, sitting
# where changes are normally reviewed, and merging it is the whole fix.
#
# The branch is force-pushed and reused, so a week of upstream changes is one pull request that
# keeps up to date rather than seven that conflict with each other.

name: i18n sync

on:
  # Daily. The catalogs change when copy is written, which is often enough that a week is too long
  # to leave `drift-check` red and rare enough that an hourly job would mostly prove nothing changed.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-sync
  # Deliberately NOT cancel-in-progress: a run that is midway through pushing a branch should finish
  # rather than leave it half-updated.
  cancel-in-progress: false

env:
  # Must match `ci.yml`. The generated Dart is written through `dart format`, so a different SDK can
  # format it differently — which would make this job produce a change that `drift-check` then
  # rejects, and the two would argue with each other forever.
  FLUTTER_VERSION: "3.44.2"

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Check out the shared locale catalogs beside this repo
        uses: actions/checkout@v7
        with:
          repository: chordia-fm/i18n
          path: .i18n-src
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resync
        run: dart tool/sync_i18n.dart --source .i18n-src

      - name: Anything to do?
        id: check
        run: |
          if git diff --quiet -- app/assets/i18n app/lib/i18n; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Locale assets already match the catalogs."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- app/assets/i18n app/lib/i18n
          fi

      - name: Open or update the resync pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=chore/i18n-resync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          # Only the generated paths. `.i18n-src` is a full checkout of another repository sitting
          # in this working tree, and `git add -A` would commit all of it.
          git add app/assets/i18n app/lib/i18n
          # Name the upstream commit these were generated from, so a reviewer can see which
          # catalog change this reflects rather than inferring it from the diff.
          upstream=$(git -C .i18n-src rev-parse --short HEAD)
          git commit -m "chore(i18n): resync the locale assets" \
            -m "Generated by the i18n sync workflow from chordia-fm/i18n@$upstream."
          git push -f origin "$branch"
          open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "Existing pull request updated in place."
            exit 0
          fi
          # Heredoc rather than an inline --body: inside a YAML block scalar a continued string
          # keeps its extra indentation, and four leading spaces is a markdown code block.
          cat > /tmp/pr-body.md <<'BODY'
          The catalogs in `chordia-fm/i18n` moved and the generated files here did not.

          `app/assets/i18n/en.json` and `app/lib/i18n/keys.g.dart` are generated and committed, so
          `drift-check` fails on main until they are regenerated — and nothing upstream knows this
          repo exists. This pull request is that regeneration, opened by the daily sync.

          Produced by `dart tool/sync_i18n.dart`. Read the diff as generated output: if it removes
          keys, a catalog lost them upstream, which is worth understanding before merging.
          BODY
          gh pr create --head "$branch" --title "Resync the locale assets" --body-file /tmp/pr-body.md

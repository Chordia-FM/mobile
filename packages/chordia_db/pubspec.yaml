name: chordia_db
description: >-
  On-device storage: the durable scrobble queue, the download index, the hub registry and a
  stale-while-revalidate response cache.
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  meta: ^1.16.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.34.0
  lints: ^6.0.0
  sqlite3: ^3.4.0
  test: ^1.25.0

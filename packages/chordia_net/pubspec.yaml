name: chordia_net
description: >-
  The one place Chordia opens a socket. Builds HttpClients that validate a library server by the
  SHA-256 fingerprint the Hub directory advertises, so self-signed certs are safe to stream from.
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

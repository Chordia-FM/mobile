name: chordia_api
description: >-
  Clients for both Chordia planes: the Hub control API (bearer session) and library servers (bearer
  capability token), plus the grant cache that keeps streaming authorised.
publish_to: "none"
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  chordia_net: ^0.1.0
  chordia_sync: ^0.1.0
  crypto: ^3.0.6
  meta: ^1.16.0
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

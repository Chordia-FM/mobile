name: chordia_mobile
description: "Chordia — self-hosted music streaming"
publish_to: "none"
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  app_links: ^6.4.0
  # Direct, not transitive through chordia_player: `bootstrap` calls `AudioService.init` itself,
  # because the media session has to exist before the first frame.
  audio_service: ^0.18.18
  cached_network_image: ^3.4.1
  chordia_api: ^0.1.0
  chordia_db: ^0.1.0
  chordia_net: ^0.1.0
  chordia_player: ^0.1.0
  chordia_sync: ^0.1.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  # No dio: every request goes through the pinned HttpClient in chordia_net, and an HTTP wrapper
  # whose adapter has to be swapped out to honour that only obscures where the socket comes from.
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  go_router: ^16.0.0
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  share_plus: ^12.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  # The Hub's realtime socket, which is the phone's only pipe into the cross-device player
  # mesh. Its `IOWebSocketChannel` takes the same pinned `HttpClient` every other Chordia
  # request goes through, so the socket is not a second, unpinned way onto the network.
  web_socket_channel: ^3.0.3

dev_dependencies:
  build_runner: ^2.4.13
  # Test-only: the DAO-backed screens are exercised against `NativeDatabase.memory()`, the same
  # in-memory database `chordia_db`'s own tests use. The app itself never opens one directly — it
  # goes through `package:chordia_db/open.dart`.
  drift: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/

# Launcher icons, generated with `dart run flutter_launcher_icons` and COMMITTED. Regenerate only
# when the mark changes; see assets/brand/README.md for where these come from.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  # Android 8+ composites these two and animates them independently. The foreground is the UNPADDED
  # render: this tool insets it 16% to make the safe zone itself, and feeding it the maskable file —
  # which already carries 10% padding of its own — would stack the two and leave the mark at roughly
  # half the icon, visibly smaller than everything else in the launcher.
  adaptive_icon_background: "#040208"
  adaptive_icon_foreground: assets/brand/icon.png
  # The monochrome layer Android 13+ tints for themed icons. Same artwork: the system takes the
  # alpha and discards the colour, so a flat silhouette is what it actually renders.
  adaptive_icon_monochrome: assets/brand/icon.png
  remove_alpha_ios: true

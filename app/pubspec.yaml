name: chordia_mobile
description: "Chordia — self-hosted music streaming"
publish_to: "none"
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  app_links: ^6.4.0
  cached_network_image: ^3.4.1
  chordia_api: ^0.1.0
  chordia_db: ^0.1.0
  chordia_net: ^0.1.0
  chordia_player: ^0.1.0
  chordia_sync: ^0.1.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.6
  # No dio: every request goes through the pinned HttpClient in chordia_net, and an HTTP wrapper
  # whose adapter has to be swapped out to honour that only obscures where the socket comes from.
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  go_router: ^16.0.0
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  share_plus: ^12.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/

name: chordia_workspace
description: >-
  Workspace root for the Chordia mobile client. Holds no code itself; it exists so the app and its
  packages share one dependency resolution and one lockfile.
publish_to: "none"

environment:
  sdk: ^3.12.0

workspace:
  - app
  - packages/chordia_net
  - packages/chordia_api
  - packages/chordia_db
  - packages/chordia_sync
  - packages/chordia_player
